appId: com.timetracker.app
productName: TimeTracker
copyright: Copyright © 2026

# Used by the "Release" GitHub Actions workflow (.github/workflows/release.yml)
# to publish built installers to a GitHub Release. owner/repo are inferred
# from package.json's "repository" field — update that field before the
# first real release (see docs/build-and-release.md §5).
publish:
  provider: github
  releaseType: release

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - node_modules/**/*

extraResources:
  - from: resources
    to: resources

asarUnpack:
  - '**/*.node'

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: TimeTracker

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
